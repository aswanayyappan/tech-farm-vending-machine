<!-- Script for real-time clock update & tactile feedback -->
<script data-purpose="clock-and-interactivity">
    // Update live station clock
    function updateClock() {
      const clockEl = document.getElementById('system-clock');
      if (!clockEl) return;
      
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12; // 0 should be 12
      const formattedHours = String(hours).padStart(2, '0');
      
      clockEl.textContent = `${formattedHours}:${minutes} ${ampm}`;
    }
    
    setInterval(updateClock, 1000);
    updateClock();

    // Tactile screen tap ripple effect simulation on touch / click
    const kioskArea = document.getElementById('kiosk-touch-area');
    if (kioskArea) {
      kioskArea.addEventListener('pointerdown', (e) => {
        // Prevent multi-spawning excessive DOM ripples if clicked on buttons
        const rect = kioskArea.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const ripple = document.createElement('div');
        ripple.style.position = 'absolute';
        ripple.style.left = `${x}px`;
        ripple.style.top = `${y}px`;
        ripple.style.transform = 'translate(-50%, -50%)';
        ripple.style.width = '20px';
        ripple.style.height = '20px';
        ripple.style.borderRadius = '50%';
        ripple.style.background = 'radial-gradient(circle, rgba(158,240,26,0.8) 0%, rgba(204,255,51,0.2) 65%, transparent 100%)';
        ripple.style.boxShadow = '0 0 25px rgba(158, 240, 26, 0.7)';
        ripple.style.pointerEvents = 'none';
        ripple.style.zIndex = '30';
        ripple.style.transition = 'all 0.65s cubic-bezier(0.1, 0.8, 0.3, 1)';

        kioskArea.appendChild(ripple);

        requestAnimationFrame(() => {
          ripple.style.width = '260px';
          ripple.style.height = '260px';
          ripple.style.opacity = '0';
        });

        setTimeout(() => {
          ripple.remove();
        }, 700);
      });
    }
  </script>
