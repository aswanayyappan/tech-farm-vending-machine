<script data-purpose="kiosk-interactivity">
    // Live Clock Simulator
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const clockElement = document.getElementById('kiosk-live-clock');
      if (clockElement) {
        clockElement.textContent = `${hours}:${minutes}`;
      }
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Tactile Touch Event Feedback
    const smartBinBtn = document.getElementById('btn-select-smart-bin');
    const vendingMachineBtn = document.getElementById('btn-select-vending-machine');
    const helpBtn = document.getElementById('btn-help');
    const adminBtn = document.getElementById('admin-login-button');

    if (smartBinBtn) {
      smartBinBtn.addEventListener('click', () => {
        // Visual indicator on touch
        smartBinBtn.classList.add('ring-4', 'ring-limeAccent');
        setTimeout(() => {
          smartBinBtn.classList.remove('ring-4', 'ring-limeAccent');
          alert('Opening Smart Bin touchless disposal flap...');
        }, 180);
      });
    }

    if (vendingMachineBtn) {
      vendingMachineBtn.addEventListener('click', () => {
        vendingMachineBtn.classList.add('ring-4', 'ring-chartreuse');
        setTimeout(() => {
          vendingMachineBtn.classList.remove('ring-4', 'ring-chartreuse');
          alert('Loading Product Catalog and Dispense Options...');
        }, 180);
      });
    }

    if (helpBtn) {
      helpBtn.addEventListener('click', () => {
        alert('Attendant notified. An eco-station guide has been alerted to Terminal West Unit #04.');
      });
    }

    if (adminBtn) {
      adminBtn.addEventListener('click', () => {
        const pin = prompt('Staff Passcode:');
        if (pin === '1234' || pin) {
          alert('Admin diagnostic mode unlocked.');
        }
      });
    }
  </script>
<!-- END: Interactive Feedback Script -->
